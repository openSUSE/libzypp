acl from_localhost src 127.0.0.1 ::1

include ./testproxy.conf
http_access allow from_localhost
http_access allow to_localhost
http_access deny all

# no caching
cache deny all

# instant shutdown
shutdown_lifetime 0

# do not depend on the hostname of the test machine, a failing
# hostname lookup can delay the startup for a long time
visible_hostname localhost
